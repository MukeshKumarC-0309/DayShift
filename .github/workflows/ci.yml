name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first — no point finishing a
# run for a commit nobody is waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported floor, and the version most contributors will
        # actually have installed.
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check backend tests scripts

      - name: Check formatting
        run: ruff format --check backend tests scripts

      - name: Test
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npx prettier --check .

      - name: Type-check
        run: npx tsc --noEmit

      - name: Component tests
        run: npx vitest run

      - name: Build
        run: npm run build

  integration:
    name: API types + end to end
    runs-on: ubuntu-latest
    env:
      # Chrome comes preinstalled on GitHub's Ubuntu runners.
      E2E_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Makefile and the e2e config both expect the backend in .venv.
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          npm ci --prefix frontend

      - name: API types are current
        run: make api-types-check

      # Without this, a missing browser would skip the e2e run and pass.
      - name: Browser is present
        run: test -x "$E2E_BROWSER"

      - name: End to end
        run: make e2e

  windows:
    name: Windows (tests + start.cmd)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests on Windows
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

      # The first run on a fresh Windows machine, exactly as a user starts it:
      # start.cmd creates .venv, installs everything, starts both servers.
      # Then the Windows `dayshift` command reports and stops them.
      - name: start.cmd brings the app up; dayshift stops it
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'start.out.log'
          $err = Join-Path $env:RUNNER_TEMP 'start.err.log'
          Start-Process -FilePath cmd.exe -ArgumentList '/c', 'start.cmd' `
            -RedirectStandardOutput $out -RedirectStandardError $err | Out-Null

          function Test-Ok([string]$Url) {
            try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 $Url).StatusCode -eq 200 }
            catch { $false }
          }
          $up = $false
          foreach ($i in 1..150) {
            if ((Test-Ok 'http://localhost:5173/') -and (Test-Ok 'http://localhost:5173/api/health')) {
              $up = $true; break
            }
            Start-Sleep -Seconds 2
          }
          Get-Content $out -ErrorAction SilentlyContinue
          if (-not $up) {
            Write-Host '--- stderr'; Get-Content $err -ErrorAction SilentlyContinue
            Write-Host '--- backend.err.log'; Get-Content backend.err.log -ErrorAction SilentlyContinue
            throw 'Dayshift did not come up from start.cmd within 5 minutes.'
          }
          Write-Host "API: $((Invoke-WebRequest -UseBasicParsing http://localhost:5173/api/health).Content)"

          powershell -NoProfile -ExecutionPolicy Bypass -File bin\dayshift.ps1 status
          powershell -NoProfile -ExecutionPolicy Bypass -File bin\dayshift.ps1 stop
          Start-Sleep -Seconds 3
          $still = Get-NetTCPConnection -LocalPort 8000, 5173 -State Listen -ErrorAction SilentlyContinue
          if ($still) { throw 'dayshift stop left a server running.' }
          Write-Host 'Stopped cleanly.'
