[pytest]
testpaths = tests
# `backend` so modules import the same way the app does (flat, not a package);
# `tests` so test modules can import shared fixtures from conftest.
pythonpath = backend tests
addopts = -q --strict-markers
filterwarnings =
    # Third-party deprecations (anyio via starlette's TestClient) are not ours
    # to fix and should not fail the suite.
    ignore::DeprecationWarning
